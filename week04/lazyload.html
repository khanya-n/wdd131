<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading</title>
    <link rel="stylesheet" href="styles/lazyload.css">

    <script defer src="scripts/lazyload.js"></script>
</head>
<body>
    <header>
        Header
    </header>
    <main>
        <h1>Lazy Loading</h1>
        <img src="https://placehold.co/400x600/red/white" alt="Red block" loading="lazy">
        <img src="https://placehold.co/400x600/orange/white" alt="Orange block" loading="lazy">
        <img src="https://placehold.co/400x600/yellow/black" alt="Yellow block" loading="lazy">
        <img src="https://placehold.co/400x600/green/white" alt="Green block" loading="lazy">
        <img src="https://placehold.co/400x600/blue/white" alt="Blue blocl" loading="lazy">
        <img src="https://placehold.co/400x600/purple/white" alt="Purple block" loading="lazy">
    </main>
    <footer>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
